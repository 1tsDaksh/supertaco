[build-system]
requires = ["setuptools>=68.0", "pip"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sandboxtune"
version = "0.1.0"
description = "AI-supervised fine-tuning sandbox for Nebius x NVIDIA Hackathon"

requires-python = ">=3.11,<3.12"

dependencies = [
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "openai>=1.5",
    "nebius>=0.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "streamlit>=1.4",
    "datasets>=3.0",
    "tavily-python>=0.5",
]

dev-dependencies = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
]

[project.scripts]
sandboxtune = "sandboxtune.cli:main"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "TID", "B90"]

[tool.mypy.disallow_untyped_defs] = false
[tool.mypy.disallow_untyped_calls] = false