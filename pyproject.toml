[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supertaco"
version = "0.1.0"
description = "AI-supervised fine-tuning sandbox for Nebius x NVIDIA Hackathon"

requires-python = ">=3.11"

dependencies = [
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "openai>=1.5",
    "nebius>=0.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "streamlit>=1.4",
    "datasets>=3.0",
    "tavily-python>=0.5",
    "plotly>=5.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
supertaco = "supertaco.cli:main"

[tool.setuptools.packages.find]
include = ["supertaco*"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "TID", "B90"]

[tool.mypy]
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits real APIs and costs money (deselect with -m 'not integration')",
]
